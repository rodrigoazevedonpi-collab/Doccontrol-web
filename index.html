<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#17334a"><link rel="manifest" href="manifest.json"><title>DocControl</title><style> *{box-sizing:border-box}body{margin:0;background:#f3f5f7;color:#17334a;font:16px system-ui}header{background:#17334a;color:white;padding:24px}main{max-width:750px;margin:auto;padding:16px}section,article{background:white;border-radius:14px;padding:16px;margin-bottom:12px;box-shadow:0 2px 8px #0001}input,select,button{font:inherit;padding:12px;border-radius:8px;border:1px solid #ccd5dd;max-width:100%}input:not([type=file]),select{width:100%}label{display:block;margin:10px 0}button{background:#17334a;color:white;cursor:pointer;margin:4px 0}button.secondary{background:white;color:#17334a}button.danger{background:#9b3030}small{display:block;color:#526575}h1,h2,h3,p{margin:0 0 10px} .stats{display:flex;gap:12px;flex-wrap:wrap}.stats span{flex:1;min-width:90px;background:#edf3f7;padding:12px;border-radius:8px}.stats b{display:block;font-size:25px}.warn{color:#a45b00}.late{color:#ad2828}#message{min-height:24px} </style></head><body><header><h1>DocControl</h1>Documentos pessoais • controle local</header><main><section><div class="stats"><span><b id="total">0</b>Documentos</span><span><b id="soon">0</b>Em 7 dias</span><span><b id="late">0</b>Vencidos</span></div></section><section><h2 id="formtitle">Novo documento</h2><form id="form"><label>Título<input id="title" required maxlength="150"></label><label>Categoria<input id="category" placeholder="Ex.: pessoais, residência, contratos"></label><label>Vencimento (opcional)<input id="expiry" type="date"></label><label>Anexo (PDF ou imagem)<input id="attachment" type="file" accept="application/pdf,image/*"></label><button type="submit">Salvar documento</button> <button type="button" class="secondary" id="cancel" hidden>Cancelar edição</button></form><p id="message" role="status"></p></section><section><h2>Meus documentos</h2><input id="search" placeholder="Pesquisar título ou categoria"><div id="items"></div></section><section><h2>Backup</h2><p>Guarde uma cópia em local seguro. Os dados ficam neste navegador e podem ser apagados pelo sistema.</p><button id="export">Exportar backup</button><label>Restaurar backup (adiciona registros)<input type="file" id="import" accept="application/json,.json"></label><small>O backup contém documentos em texto não criptografado. Não compartilhe.</small></section></main><script>
const $=id=>document.getElementById(id);let db,editing=null;const request=indexedDB.open('doccontrol-general',1);request.onupgradeneeded=()=>request.result.createObjectStore('docs',{keyPath:'id'});request.onerror=()=>msg('Não foi possível abrir o armazenamento local.');request.onsuccess=()=>{db=request.result;render()};function msg(s){$('message').textContent=s}function all(){return new Promise((ok,no)=>{let r=db.transaction('docs').objectStore('docs').getAll();r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}function write(fn){return new Promise((ok,no)=>{let t=db.transaction('docs','readwrite');fn(t.objectStore('docs'));t.oncomplete=ok;t.onerror=()=>no(t.error);t.onabort=()=>no(t.error)})}function days(s){if(!s)return Infinity;let n=new Date();return (Date.parse(s+'T00:00:00Z')-Date.UTC(n.getFullYear(),n.getMonth(),n.getDate()))/86400000}function el(tag,text){let e=document.createElement(tag);e.textContent=text;return e}function btn(text,fn,cls='secondary'){let b=el('button',text);b.className=cls;b.onclick=fn;return b}function download(blob,name){let u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),30000)}async function render(){let rows=await all();$('total').textContent=rows.length;$('soon').textContent=rows.filter(x=>days(x.expiry)>=0&&days(x.expiry)<=7).length;$('late').textContent=rows.filter(x=>days(x.expiry)<0).length;let q=$('search').value.toLowerCase(),root=$('items');root.replaceChildren();for(let d of rows.filter(x=>(x.title+' '+x.category).toLowerCase().includes(q)).sort((a,b)=>days(a.expiry)-days(b.expiry))){let a=el('article','');a.append(el('h3',d.title),el('small',d.category||'Sem categoria'));let n=days(d.expiry),p=el('p',!d.expiry?'Sem vencimento':n<0?'Vencido • '+d.expiry:n<=7?'Vence em '+n+' dia(s) • '+d.expiry:'Vencimento: '+d.expiry);p.className=n<0?'late':n<=7?'warn':'';a.append(p);if(d.file)a.append(btn('Baixar anexo',()=>download(d.file,d.filename)));a.append(btn('Editar',()=>{editing=d;$('title').value=d.title;$('category').value=d.category;$('expiry').value=d.expiry;$('attachment').value='';$('formtitle').textContent='Editar documento';$('cancel').hidden=false;window.scrollTo(0,0)}),btn('Excluir',async()=>{if(confirm('Excluir este documento?')){await write(s=>s.delete(d.id));render()}},'danger'));root.append(a)}if(!root.children.length)root.append(el('p','Nenhum documento encontrado.'))}function reset(){editing=null;$('form').reset();$('formtitle').textContent='Novo documento';$('cancel').hidden=true}$('cancel').onclick=reset;$('search').oninput=()=>render();$('form').onsubmit=async e=>{e.preventDefault();if(!db)return msg('Armazenamento indisponível.');let f=$('attachment').files[0];try{await write(s=>s.put({id:editing?.id||crypto.randomUUID(),title:$('title').value.trim(),category:$('category').value.trim(),expiry:$('expiry').value,file:f||editing?.file||null,filename:f?.name||editing?.filename||''}));reset();msg('Documento salvo.');render()}catch(e){msg('Falha ao salvar. Verifique o espaço disponível.')}};function dataurl(b){return new Promise((ok,no)=>{let r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(b)})}$('export').onclick=async()=>{try{let rows=await all();let docs=await Promise.all(rows.map(async d=>({...d,file:d.file?await dataurl(d.file):null})));download(new Blob([JSON.stringify({version:1,docs})],{type:'application/json'}),'doccontrol-backup.json')}catch(e){msg('Falha ao exportar.')}};$('import').onchange=async e=>{try{let j=JSON.parse(await e.target.files[0].text());if(j.version!==1||!Array.isArray(j.docs))throw Error();let rows=await Promise.all(j.docs.map(async d=>{if(typeof d.title!=='string'||typeof d.category!=='string'||typeof d.expiry!=='string'||(d.expiry&&!/^\d{4}-\d{2}-\d{2}$/.test(d.expiry)))throw Error();let file=null;if(d.file){if(typeof d.file!=='string'||!/^data:(application\/pdf|image\/[a-z0-9.+-]+);base64,/i.test(d.file))throw Error();file=await(await fetch(d.file)).blob()}return {id:crypto.randomUUID(),title:d.title,category:d.category,expiry:d.expiry,filename:String(d.filename||'anexo'),file}}));await write(s=>rows.forEach(d=>s.put(d)));msg('Backup importado.');render()}catch(e){msg('Backup inválido ou falha de armazenamento.')}e.target.value=''};if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>msg('Modo offline indisponível.'));
</script></body></html>
